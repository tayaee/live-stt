[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live-stt"
version = "0.1.0"
description = "Windows 백그라운드 음성 받아쓰기 데몬 (Right Alt 시작/종료, Right Shift 재작성)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai",
    "sounddevice",
    "numpy",
]

[project.scripts]
live-stt = "live_stt.daemon:main"